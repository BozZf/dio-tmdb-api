spring.application.name=lab-spring-pattern-movie
spring.mvc.problemdetails.enabled=true
springdoc.override-with-generic-response=false

tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.url=https://api.themoviedb.org/3
spring.cloud.openfeign.client.config.tmdb.connectTimeout=2000
spring.cloud.openfeign.client.config.tmdb.readTimeout=5000
spring.cloud.openfeign.client.config.tmdb.loggerLevel=none
